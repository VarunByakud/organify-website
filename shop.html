<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Organify — Shop</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header id="siteHeaderShop" class="site-header">
    <nav class="navbar navbar-expand-lg container navbar-light">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/images/logo.png" alt="Organify logo" class="logo">
        <div>
          <div class="brand">Organify</div>
          <div class="tagline small text-muted">Fresh • Local • Organic</div>
        </div>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navShop">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navShop">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>

        <div class="ms-3 d-flex gap-2 align-items-center">
          <button class="btn btn-outline-success btn-sm" id="cartBtnShop">Cart <span class="badge bg-success" id="cartCountShop">0</span></button>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 mb-0">Shop</h2>
        <div class="d-flex gap-2 align-items-center">
          <select id="catFilter" class="form-select form-select-sm">
            <option value="">All categories</option>
            <option value="fruits">Fruits</option>
            <option value="vegetables">Vegetables</option>
            <option value="pantry">Pantry</option>
            <option value="beverages">Beverages</option>
          </select>
          <input id="searchInput" class="form-control form-control-sm" placeholder="Search products" style="width:220px;">
        </div>
      </div>

      <div class="row g-4" id="shopGrid" data-aos="fade-up"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom py-3 text-center">
      <div class="container small text-muted">© <span id="year2"></span> Organify</div>
    </div>
  </footer>

  <div class="modal fade" id="cartModalShop" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Your cart</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cartListShop"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Continue shopping</button>
          <a href="contact.html" class="btn btn-success">Checkout</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

  <script src="assets/js/script.js"></script>
  <script> AOS.init({ once:true, duration:800 }); </script>
</body>
</html>
