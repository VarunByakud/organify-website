<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Organify</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg container navbar-light">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/images/logo.png" alt="Organify logo" class="logo">
        <div>
          <div class="brand">Organify</div>
          <div class="tagline small text-muted">Fresh • Local • Organic</div>
        </div>
      </a>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <h1>Contact us</h1>
      <p class="text-muted">Questions or custom orders? Send us a message.</p>

      <div class="row g-4">
        <div class="col-md-6">
          <form id="contactForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input class="form-control" id="name" required>
              <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input class="form-control" id="email" type="email" required>
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" required></textarea>
              <div class="invalid-feedback">Please enter a message.</div>
            </div>

            <button class="btn btn-success" type="submit">Send Message</button>
          </form>
        </div>

        <div class="col-md-6 text-center">
          <img src="assets/images/img12.jpg" alt="strawberries" class="img-fluid rounded shadow-sm">
          <div class="mt-3 small text-muted">Visit our store at 123 Organic Ave.</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom py-3 text-center">
      <div class="container small text-muted">© <span id="year6"></span> Organify</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="assets/js/script.js"></script>
  <script> AOS.init({ once:true, duration:800 }); </script>
</body>
</html>
